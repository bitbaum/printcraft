name: Deploy

# Push to main → deploy this app to bitbaum. All the logic lives in one
# place: maonakamoto/fleetcrown/.github/workflows/selfhost-deploy.yml
# (docs: docs/infrastructure/self-host-cd.md there). It waits for this
# commit's own CI to go green before anything reaches the box.

on:
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  deploy:
    uses: maonakamoto/fleetcrown/.github/workflows/selfhost-deploy.yml@main
    with:
      app: printcraft
      # Root has no workspaces and (deliberately) no real dependencies — its
      # package-lock.json is a trivial 1-package lockfile just so the shared
      # workflow's root-level `npm ci` has something to install. Skip lockfile
      # sniffing so a lockfile edit at root can't silently flip this.
      package-manager: npm
    secrets: inherit
