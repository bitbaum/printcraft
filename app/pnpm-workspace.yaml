# pnpm 11 blocks dependency build scripts by default; allow only what we trust.
# msw's postinstall just checks for a worker script — harmless, and allowed so
# the install log stays clean.
allowBuilds:
  esbuild: true
  msw: true
  sharp: true
  unrs-resolver: true

# Transitive advisories with no direct dependency to bump, so Dependabot never
# opens a PR for them (all of this app's alerts were against pnpm-lock.yaml).
# Each pin is the advisory's own first_patched_version, bounded to the line a
# caret can move within without breaking: the MAJOR, or for 0.x the MINOR --
# on 0.x a minor bump is a breaking one. An open-ended ">=" would let the
# resolver cross a major, which is an upgrade wearing a patch's clothes.
overrides:
  "@babel/core@7": "^7.29.6"
  "@hono/node-server@1": "^1.19.15"
  "@humanfs/node@0.16": "^0.16.8"
  "baseline-browser-mapping@2": "^2.11.0"
  "body-parser@2": "^2.3.0"
  "brace-expansion@1": "^1.1.16"
  "brace-expansion@5": "^5.0.9"
  "browserslist@4": "^4.28.7"
  "esbuild@0.28": "^0.28.1"
  "fast-uri@3": "^3.1.6"
  "hono@4": "^4.13.5"
  "ip-address@10": "^10.3.1"
  "js-yaml@4": "^4.3.2"
  "nanoid@3": "^3.3.18"
  "postcss@8": "^8.5.23"
  "postcss-selector-parser@7": "^7.1.3"
  "qs@6": "^6.16.0"
  "ws@8": "^8.21.0"
