[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "printcraft"
version = "0.1.0"
description = "Custom artwork generation for physical print surfaces"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.40",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
printcraft = "printcraft.cli:app"

[tool.setuptools.packages.find]
include = ["printcraft*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
