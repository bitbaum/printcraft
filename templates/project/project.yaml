# PrintCraft project manifest — rename this file's parent dir to <client-name>
# and fill in the fields below. Everything (prompts, rounds, compositing)
# derives from this file.

client: ClientName
title: Project Title
status: in-progress # in-progress | blocked | complete | archived
created: 2026-XX-XX

# ──────────────────────────────────────────────────────────────
# Physical surface being printed on
# ──────────────────────────────────────────────────────────────
surface:
  name: describe-the-surface # e.g. shower-wall-corner, canvas-landscape
  dpi: 150 # 150 min, 200-300 preferred
  bleed_mm: 3 # ink past the trim line on every panel edge; ask your print shop
  panels:
    - id: main
      width_cm: 100
      height_cm: 100
    # For multi-panel surfaces:
    # - id: left
    #   width_cm: 80
    #   height_cm: 200
    # - id: right
    #   width_cm: 120
    #   height_cm: 200
  mounting: flat # flat | corner | curved
  material: canvas # canvas | glass | acrylic | fabric

# ──────────────────────────────────────────────────────────────
# Art direction — this prompt is included in every generation
# ──────────────────────────────────────────────────────────────
style:
  name: style-name # e.g. retro-italian-poster-1960s
  prompt: |
    One or two sentences describing the art style. KEEP THIS SHORT —
    long prompts cause Grok to route to photo-edit mode instead of Aurora.
    See docs/LEARNINGS.md on the short-prompt rule.
  negative: photorealistic, text overlay, watermark, signature

# ──────────────────────────────────────────────────────────────
# Scene setting
# ──────────────────────────────────────────────────────────────
scene:
  setting: Where and when (e.g. "Lake Garda at golden sunset")
  description: |
    One paragraph describing the overall scene mood and content.

# ──────────────────────────────────────────────────────────────
# Characters — people/subjects with reference photos
# ──────────────────────────────────────────────────────────────
characters:
  - id: main-subject
    role: hero # hero | supporting | background
    reference_photo: source/photos/main.jpg
    notes: Who this is, what's distinctive about them
  # - id: friend-1
  #   role: supporting
  #   reference_photo: source/photos/friend1.jpg
  #   notes: ...

# ──────────────────────────────────────────────────────────────
# Scenes — each becomes a prompt + reference for generation
# ──────────────────────────────────────────────────────────────
scenes:
  - id: hero
    description: One-sentence scene description
    reference_photo: source/photos/main.jpg
    character_ids: [main-subject]
    composition_role: hero
  # - id: second-scene
  #   ...

# ──────────────────────────────────────────────────────────────
# Generation preferences
# ──────────────────────────────────────────────────────────────
models:
  default: grok-aurora
